name: Regenerate global MorphHB audit

on:
  push:
    # Use a fresh dedicated refresh branch after each morphology test merge.
    # Regenerate source-wide MorphHB coverage after the Hiphil participle regression merge.
    branches:
      - 'chore/morphhb-audit-refresh-*'
    paths:
      - .github/workflows/refresh-morphhb-audit.yml
      - scripts/audit-morphhb-global-morphology.mjs
      - apps/web/src/lib/strongsHebrewMorphology.ts
      - apps/web/src/lib/strongsHebrewMorphology.test.ts
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BSMP
        uses: actions/checkout@v4

      - name: Checkout Open Scriptures MorphHB into runner temp
        env:
          MORPHHB_REPOSITORY: https://github.com/openscriptures/morphhb.git
        run: |
          git clone --depth 1 "$MORPHHB_REPOSITORY" "$RUNNER_TEMP/morphhb"

      - name: Capture exact source refs
        id: refs
        run: |
          echo "morphhb_commit=$(git -C "$RUNNER_TEMP/morphhb" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "test_blob_sha=$(git rev-parse HEAD:apps/web/src/lib/strongsHebrewMorphology.test.ts)" >> "$GITHUB_OUTPUT"

      - name: Generate full audit
        env:
          BSMP_AUDIT_COMMIT: ${{ github.sha }}
          BSMP_TEST_FILE_BLOB_SHA: ${{ steps.refs.outputs.test_blob_sha }}
          MORPHHB_COMMIT: ${{ steps.refs.outputs.morphhb_commit }}
        run: |
          node scripts/audit-morphhb-global-morphology.mjs \
            --source "$RUNNER_TEMP/morphhb/wlc" \
            --parser apps/web/src/lib/strongsHebrewMorphology.ts \
            --tests apps/web/src/lib/strongsHebrewMorphology.test.ts \
            --out-md docs/morphhb-global-morphology-audit.md \
            --out-csv docs/morphhb-global-morphology-codes.csv
          echo "MorphHB source commit: $MORPHHB_COMMIT"
          echo "BSMP test file blob: $BSMP_TEST_FILE_BLOB_SHA"

      - name: Upload generated audit
        uses: actions/upload-artifact@v4
        with:
          name: morphhb-global-audit-20261016l
          path: |
            docs/morphhb-global-morphology-audit.md
            docs/morphhb-global-morphology-codes.csv
          if-no-files-found: error

      - name: Commit refreshed audit on audit branch
        env:
          AUDIT_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/morphhb-global-morphology-audit.md docs/morphhb-global-morphology-codes.csv
          if git diff --cached --quiet; then
            echo "Generated reports are already current."
          else
            git commit -m "docs(morphology): refresh global audit after regression coverage"
            git push origin "HEAD:$AUDIT_BRANCH"
          fi
